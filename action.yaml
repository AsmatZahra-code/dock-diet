name: 'Dock-Diet Scanner'
description: 'Scans Dockerfiles for size optimization, security issues, and provides a Diet Score.'
author: 'Asmat Zahra'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  dockerfile_path:
    description: 'Path to the Dockerfile you want to scan'
    required: false
    default: 'Dockerfile'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/asmatZahra-code/dock-diet:latest'
  args:
    - "scan"
    - "${{ inputs.dockerfile_path }}"
